<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>رحلتي مع الجيم</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="رحلتي مع الجيم" />
<meta name="theme-color" content="#12151A" />
<style>
  @property --pct{
    syntax: '<number>';
    inherits: true;
    initial-value: 0;
  }
  :root{
    color-scheme: light dark;
    --ink:#181B21;
    --paper:#F1F2F0;
    --steel:#6C7580;
    --line:rgba(24,27,33,0.10);
    --surface:#FFFFFF;
    --surface-2:#E9EBE9;
    --shadow:0 1px 2px rgba(24,27,33,0.06), 0 10px 22px -16px rgba(24,27,33,0.22);
    --font-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Tahoma, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECEDEE;
      --paper:#12151A;
      --steel:#8B939C;
      --line:rgba(236,237,238,0.12);
      --surface:#1B1F25;
      --surface-2:#242931;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 14px 26px -18px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECEDEE;
    --paper:#12151A;
    --steel:#8B939C;
    --line:rgba(236,237,238,0.12);
    --surface:#1B1F25;
    --surface-2:#242931;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 14px 26px -18px rgba(0,0,0,0.55);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-ui); }
  .hidden{ display:none !important; }
  .app{ max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;
        padding: max(20px, env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom)); }

  .eyebrow{ text-transform:uppercase; letter-spacing:0.08em; font-size:11px; color:var(--steel); margin:0 0 4px; font-weight:600; }
  h1{ font-family:var(--font-display); font-size:clamp(22px,6.5vw,28px); margin:0 0 22px; font-weight:800;
      text-wrap:balance; letter-spacing:-0.015em; }

  .month-card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px;
               margin-bottom:16px; box-shadow:var(--shadow); }

  .month-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .month-title{ font-family:var(--font-display); font-size:17px; font-weight:800; margin:0 0 8px 0;
                letter-spacing:-0.01em; color:var(--card-a); }
  .month-dates{ display:flex; gap:8px; flex-wrap:wrap; }
  .date-field{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--steel); font-weight:600;
               background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:5px 9px; }
  .date-field input{ border:none; background:transparent; font-family:var(--font-mono); font-size:12px;
                      color:var(--ink); direction:ltr; }
  .date-field input:focus{ outline:none; }
  .month-delete{ appearance:none; background:none; border:none; color:var(--steel); font-size:20px; line-height:1;
                 cursor:pointer; padding:2px 6px; border-radius:8px; flex-shrink:0; }
  .month-delete:hover{ color:var(--card-a); }

  .month-summary{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .count-wrap{ position:relative; width:100px; height:100px; flex-shrink:0; }
  .count-ring{ position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from -90deg, var(--card-a) 0deg, var(--card-b) calc(var(--pct) * 1.8deg),
                var(--card-c) calc(var(--pct) * 3.6deg), var(--surface-2) calc(var(--pct) * 3.6deg) 360deg);
    box-shadow:0 10px 22px -10px var(--card-glow);
    transition: --pct 0.7s cubic-bezier(.22,.9,.32,1), box-shadow 1.6s ease-in-out; }
  .count-inner{ position:absolute; inset:10px; border-radius:50%; background:var(--surface); display:flex;
                flex-direction:column; align-items:center; justify-content:center; }
  .count-value{ font-family:var(--font-display); font-size:27px; font-weight:800; color:var(--ink); line-height:1;
                font-variant-numeric:tabular-nums; display:inline-block; }
  .count-label{ font-size:10px; color:var(--steel); font-weight:700; margin-top:3px; }

  .mini-fields{ flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .mini-field{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--paper);
               border:1px solid var(--line); border-radius:11px; padding:9px 11px; }
  .mini-field-label{ font-size:11px; color:var(--steel); font-weight:600; }
  .mini-field-input{ display:flex; align-items:center; gap:5px; }
  .mini-field input{ width:70px; border:none; background:transparent; font-family:var(--font-display); font-size:17px;
                      font-weight:700; letter-spacing:-0.01em; color:var(--ink); direction:ltr; text-align:left;
                      font-variant-numeric:tabular-nums; }
  .mini-field input::placeholder{ font-weight:400; color:var(--steel); }
  .mini-field input:focus{ outline:none; }
  .mini-field .unit{ font-size:10.5px; color:var(--steel); font-weight:700; letter-spacing:0.02em; }
  .mini-field.result{ background:var(--card-tint); border-color:var(--card-a); }
  .mini-field.result .mini-field-value{ display:flex; align-items:baseline; gap:4px; font-weight:800; font-size:20px;
      letter-spacing:-0.01em; color:var(--card-a); font-family:var(--font-display); font-variant-numeric:tabular-nums;
      direction:ltr; }

  .btn-save-attendance{ appearance:none; border:none; border-radius:11px; padding:12px; font-size:13.5px;
      font-weight:700; cursor:pointer; width:100%; margin-top:12px; background:var(--card-a); color:#fff;
      font-family:var(--font-ui); }
  .btn-save-attendance:focus-visible{ outline:2px solid var(--card-a); outline-offset:2px; }
  .btn-save-attendance:active{ opacity:0.85; }

  .month-days summary{ cursor:pointer; font-size:12.5px; font-weight:700; color:var(--card-a); list-style:none;
                        display:flex; align-items:center; gap:6px; padding:8px 2px; }
  .month-days summary::-webkit-details-marker{ display:none; }
  .month-days summary::before{ content:'›'; display:inline-block; font-size:16px; transition:transform .15s ease; }
  .month-days[open] summary::before{ transform:rotate(90deg); }
  .day-hint{ font-size:11.5px; color:var(--steel); margin:2px 0 12px; line-height:1.5; }
  .day-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .week-divider{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:12px 2px 4px; }
  .week-divider:first-child{ padding-top:0; }
  .week-title{ font-size:12.5px; font-weight:700; color:var(--ink); }
  .week-range{ font-size:11px; color:var(--steel); }
  .day-row{ appearance:none; width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
            background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 14px;
            cursor:pointer; text-align:right; color:var(--ink);
            transition:background-color .15s ease, border-color .15s ease; }
  .day-row.is-attended{ background:var(--card-tint); border-color:var(--card-a); }
  .day-row.is-today{ box-shadow: inset 0 0 0 2px var(--card-a); }
  .day-row:focus-visible{ outline:2px solid var(--card-a); outline-offset:2px; }
  .day-info{ display:flex; align-items:baseline; gap:8px; }
  .day-weekday{ font-size:13px; color:var(--steel); font-weight:600; min-width:52px; }
  .day-date{ font-size:14.5px; font-weight:600; }
  .day-today-tag{ font-size:10px; color:var(--card-a); font-weight:700; }
  .day-check{ width:24px; height:24px; border-radius:50%; border:2px solid var(--line); display:flex;
              align-items:center; justify-content:center; color:#fff; flex-shrink:0;
              transition:background-color .15s ease, border-color .15s ease; }
  .day-check.is-checked{ background:var(--card-a); border-color:var(--card-a); }

  .btn-add{ appearance:none; background:transparent; border:1.5px dashed var(--line); color:var(--steel);
            border-radius:16px; padding:14px; font-weight:700; width:100%; cursor:pointer; font-size:14px;
            margin-bottom:26px; font-family:var(--font-ui); }
  .btn-add:hover{ border-color:var(--steel); color:var(--ink); }
  .btn-add:focus-visible{ outline:2px solid var(--steel); outline-offset:2px; }

  .backup{ border-top:1px solid var(--line); padding-top:16px; margin-top:auto; }
  .backup-note{ font-size:12px; color:var(--steel); line-height:1.5; margin:0 0 12px; }
  .backup-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ appearance:none; border:none; border-radius:12px; padding:13px 16px; font-size:14.5px; font-weight:700;
        cursor:pointer; min-height:46px; width:100%; display:inline-flex; align-items:center; justify-content:center;
        font-family:var(--font-ui); }
  .btn-outline{ background:var(--surface); border:1px solid var(--line); color:var(--ink); }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .backup-actions .btn{ flex:1; min-width:150px; }

  .toast{ position:fixed; bottom:20px; left:50%; z-index:10; background:var(--ink); color:var(--paper);
          padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
          opacity:0; transform:translate(-50%,8px); pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion:reduce){
    .day-row, .count-ring, .toast, .month-days summary::before{ transition:none; }
  }

  @media (prefers-reduced-motion:no-preference){
    @keyframes ringIn{ from{ opacity:0; transform:scale(0.82); } to{ opacity:1; transform:scale(1); } }
    @keyframes ringGlow{ 0%,100%{ box-shadow:0 10px 22px -10px var(--card-glow); }
                          50%{ box-shadow:0 14px 30px -8px var(--card-glow); } }
    @keyframes countBump{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
    .count-wrap{ animation: ringIn .55s cubic-bezier(.34,1.56,.64,1) both; }
    .count-ring{ animation: ringGlow 3.4s ease-in-out infinite; }
    .count-value.bump{ animation: countBump .35s cubic-bezier(.34,1.56,.64,1); }
  }
</style>
</head>
<body>
<div class="app" dir="rtl" lang="ar">
  <header class="hd">
    <p class="eyebrow">تتبّع الحضور</p>
    <h1>رحلتي مع الجيم</h1>
  </header>

  <div id="monthsContainer"></div>
  <button id="btnAddMonth" class="btn-add" type="button">+ إضافة شهر جديد</button>

  <section class="backup">
    <p class="backup-note">
      البيانات محفوظة على الموبايل ده بس. اعمل نسخة احتياطية بين كل فترة وارفعها على OneDrive عشان متضيعش لو غيّرت جهازك أو مسحت المتصفح.
    </p>
    <div class="backup-actions">
      <button id="btnExport" class="btn btn-outline" type="button">تنزيل نسخة احتياطية</button>
      <label class="btn btn-outline" for="importFile">استرجاع نسخة احتياطية</label>
      <input type="file" id="importFile" accept="application/json" class="hidden" />
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'gymTrackerData';
  const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  const RING_PALETTES = [
    { a:'#0EA968', b:'#17C97A', c:'#9AE637', tint:'rgba(14,169,104,0.12)', glow:'rgba(23,201,122,0.45)' },
    { a:'#3D7CFF', b:'#3DD6FF', c:'#3DFFC4', tint:'rgba(61,124,255,0.12)', glow:'rgba(61,214,255,0.40)' },
    { a:'#B84DFF', b:'#FF4DD2', c:'#FF7A45', tint:'rgba(184,77,255,0.12)', glow:'rgba(255,122,69,0.40)' },
    { a:'#0FB88A', b:'#3DE0FF', c:'#3D7CFF', tint:'rgba(15,184,138,0.12)', glow:'rgba(61,224,255,0.40)' }
  ];

  let state = load();
  const monthRefs = Object.create(null);

  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {months: [defaultMonth()]};
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed.months) && parsed.months.length){
        return {months: parsed.months.map(normalizeMonth)};
      }
      return {months: [defaultMonth()]};
    } catch(e){ return {months: [defaultMonth()]}; }
  }
  function defaultMonth(){
    return {id: uid(), start:'2026-08-09', end:'2026-09-08', gymFee:0, trainerFee:0, sessions:[]};
  }
  function normalizeMonth(m){
    return {
      id: typeof m.id === 'string' ? m.id : uid(),
      start: typeof m.start === 'string' ? m.start : '2026-08-09',
      end: typeof m.end === 'string' ? m.end : '2026-09-08',
      gymFee: typeof m.gymFee === 'number' ? m.gymFee : 0,
      trainerFee: typeof m.trainerFee === 'number' ? m.trainerFee : 0,
      sessions: Array.isArray(m.sessions) ? m.sessions : []
    };
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function persist(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ showToast('البيانات متحفظتش، خزّن ذاكرة موبايلك أو المتصفح ممتلئ'); }
  }
  if('storage' in navigator && 'persist' in navigator.storage){
    navigator.storage.persist().catch(() => {});
  }
  function money(n){ return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function toArabicDigits(n){
    const map = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
    return String(n).split('').map(ch => map[ch] !== undefined ? map[ch] : ch).join('');
  }
  function toISO(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayISO(){ return toISO(new Date()); }
  function addDays(iso, n){
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return toISO(d);
  }
  function formatDateShort(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('ar-EG', {day:'numeric', month:'short'});
  }
  function buildDateRange(start, end){
    const dates = [];
    const cur = new Date(start + 'T00:00:00');
    const endD = new Date(end + 'T00:00:00');
    while(cur <= endD){
      dates.push(toISO(cur));
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  }

  function monthStats(m){
    const dates = buildDateRange(m.start, m.end);
    const count = m.sessions.filter(d => dates.includes(d)).length;
    const total = (m.gymFee || 0) + (m.trainerFee || 0);
    const cost = count > 0 ? total / count : null;
    const pct = dates.length > 0 ? Math.min(100, (count / dates.length) * 100) : 0;
    return {dates, count, total, cost, pct};
  }

  function addMonth(){
    const months = state.months;
    const last = months[months.length - 1];
    const start = addDays(last.end, 1);
    const end = addDays(start, 29);
    months.push({id: uid(), start, end, gymFee:0, trainerFee:0, sessions:[]});
    persist();
    renderAll();
  }

  function deleteMonth(id){
    if(state.months.length <= 1){ showToast('لازم يفضل شهر واحد على الأقل'); return; }
    state.months = state.months.filter(m => m.id !== id);
    persist();
    renderAll();
  }

  function updateMonthDate(id, field, value){
    const m = state.months.find(x => x.id === id);
    if(!m || !value) return;
    m[field] = value;
    persist();
    renderAll();
  }

  function toggleSession(monthId, dateStr){
    const m = state.months.find(x => x.id === monthId);
    if(!m) return;
    const idx = m.sessions.indexOf(dateStr);
    if(idx === -1) m.sessions.push(dateStr);
    else m.sessions.splice(idx, 1);
    persist();
    updateRow(monthId, dateStr);
    updateMonthDynamic(monthId);
  }

  function saveAttendance(monthId){
    persist();
    showToast('تم حفظ سجل الحضور');
  }

  function updateMonthDynamic(monthId){
    const ref = monthRefs[monthId];
    const m = state.months.find(x => x.id === monthId);
    if(!ref || !m) return;
    const {count, cost, pct} = monthStats(m);
    ref.ring.style.setProperty('--pct', pct);
    ref.countValue.textContent = count;
    ref.costValue.textContent = cost === null ? '—' : money(cost);
    ref.countValue.classList.remove('bump');
    void ref.countValue.offsetWidth;
    ref.countValue.classList.add('bump');
  }

  function updateRow(monthId, dateStr){
    const ref = monthRefs[monthId];
    const m = state.months.find(x => x.id === monthId);
    if(!ref || !m) return;
    const rowRef = ref.rowRefs[dateStr];
    if(!rowRef) return;
    const attended = m.sessions.includes(dateStr);
    rowRef.row.classList.toggle('is-attended', attended);
    rowRef.row.setAttribute('aria-pressed', attended ? 'true' : 'false');
    rowRef.check.classList.toggle('is-checked', attended);
    rowRef.check.innerHTML = attended ? CHECK_SVG : '';
  }

  function updateMonthCost(monthId){
    const ref = monthRefs[monthId];
    const m = state.months.find(x => x.id === monthId);
    if(!ref || !m) return;
    const {cost} = monthStats(m);
    ref.costValue.textContent = cost === null ? '—' : money(cost);
  }

  function renderAll(){
    const container = document.getElementById('monthsContainer');
    container.innerHTML = '';
    for(const key of Object.keys(monthRefs)) delete monthRefs[key];

    state.months.forEach((m, index) => {
      const palette = RING_PALETTES[index % RING_PALETTES.length];
      const {dates, count, cost, pct} = monthStats(m);
      const today = todayISO();

      const card = document.createElement('section');
      card.className = 'month-card';
      card.style.setProperty('--card-a', palette.a);
      card.style.setProperty('--card-b', palette.b);
      card.style.setProperty('--card-c', palette.c);
      card.style.setProperty('--card-tint', palette.tint);
      card.style.setProperty('--card-glow', palette.glow);
      card.style.setProperty('--pct', 0);

      card.innerHTML = `
        <div class="month-head">
          <div>
            <h2 class="month-title">الشهر ${toArabicDigits(index + 1)}</h2>
            <div class="month-dates">
              <label class="date-field"><span>من</span><input type="date" class="input-start" value="${m.start}" /></label>
              <label class="date-field"><span>إلى</span><input type="date" class="input-end" value="${m.end}" /></label>
            </div>
          </div>
          <button type="button" class="month-delete" aria-label="حذف الشهر">×</button>
        </div>

        <div class="month-summary">
          <div class="count-wrap">
            <div class="count-ring">
              <div class="count-inner">
                <span class="count-value">${count}</span>
                <span class="count-label">حصة</span>
              </div>
            </div>
          </div>
          <div class="mini-fields">
            <div class="mini-field">
              <span class="mini-field-label">اشتراك الجيم</span>
              <span class="mini-field-input"><input type="number" inputmode="decimal" step="0.01" min="0" class="input-gym" value="${m.gymFee || ''}" placeholder="0.00" /><span class="unit">AED</span></span>
            </div>
            <div class="mini-field">
              <span class="mini-field-label">اشتراك المدرب</span>
              <span class="mini-field-input"><input type="number" inputmode="decimal" step="0.01" min="0" class="input-trainer" value="${m.trainerFee || ''}" placeholder="0.00" /><span class="unit">AED</span></span>
            </div>
            <div class="mini-field result">
              <span class="mini-field-label">قيمة الحصة</span>
              <span class="mini-field-value"><span class="cost-value">${cost === null ? '—' : money(cost)}</span><span class="unit">AED</span></span>
            </div>
          </div>
        </div>

        <details class="month-days" ${index === state.months.length - 1 ? 'open' : ''}>
          <summary>عرض أيام الشهر</summary>
          <p class="day-hint">دوس على أي يوم عشان تعلّم عليه إنك رحت الجيم، ودوس تاني عشان تشيل العلامة، وبعدين احفظ السجل.</p>
          <ul class="day-list"></ul>
          <button type="button" class="btn-save-attendance">حفظ سجل الحضور</button>
        </details>
      `;

      const ring = card.querySelector('.count-ring');
      const countValue = card.querySelector('.count-value');
      const costValue = card.querySelector('.cost-value');
      const dayList = card.querySelector('.day-list');
      const rowRefs = Object.create(null);

      dates.forEach((dateStr, i) => {
        if(i % 7 === 0){
          const weekIdx = i / 7;
          const rangeEndIdx = Math.min(i + 6, dates.length - 1);
          const divider = document.createElement('li');
          divider.className = 'week-divider';
          divider.innerHTML = `
            <span class="week-title">الأسبوع ${toArabicDigits(weekIdx + 1)}</span>
            <span class="week-range">${formatDateShort(dates[i])} – ${formatDateShort(dates[rangeEndIdx])}</span>
          `;
          dayList.appendChild(divider);
        }
        const dObj = new Date(dateStr + 'T00:00:00');
        const attended = m.sessions.includes(dateStr);
        const isToday = dateStr === today;
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day-row' + (attended ? ' is-attended' : '') + (isToday ? ' is-today' : '');
        btn.setAttribute('aria-pressed', attended ? 'true' : 'false');
        btn.innerHTML = `
          <span class="day-info">
            <span class="day-weekday">${dObj.toLocaleDateString('ar-EG', {weekday:'long'})}</span>
            <span class="day-date">${dObj.toLocaleDateString('ar-EG', {day:'numeric', month:'long'})}</span>
            ${isToday ? '<span class="day-today-tag">النهارده</span>' : ''}
          </span>
          <span class="day-check${attended ? ' is-checked' : ''}">${attended ? CHECK_SVG : ''}</span>
        `;
        btn.addEventListener('click', () => toggleSession(m.id, dateStr));
        li.appendChild(btn);
        dayList.appendChild(li);
        rowRefs[dateStr] = {row: btn, check: btn.querySelector('.day-check')};
      });

      monthRefs[m.id] = {card, ring, countValue, costValue, rowRefs};

      const inputGym = card.querySelector('.input-gym');
      const inputTrainer = card.querySelector('.input-trainer');
      inputGym.addEventListener('input', () => {
        const val = parseFloat(inputGym.value);
        m.gymFee = isNaN(val) ? 0 : val;
        persist();
        updateMonthCost(m.id);
      });
      inputTrainer.addEventListener('input', () => {
        const val = parseFloat(inputTrainer.value);
        m.trainerFee = isNaN(val) ? 0 : val;
        persist();
        updateMonthCost(m.id);
      });

      card.querySelector('.btn-save-attendance').addEventListener('click', () => saveAttendance(m.id));

      card.querySelector('.input-start').addEventListener('change', e => updateMonthDate(m.id, 'start', e.target.value));
      card.querySelector('.input-end').addEventListener('change', e => updateMonthDate(m.id, 'end', e.target.value));
      card.querySelector('.month-delete').addEventListener('click', () => deleteMonth(m.id));

      container.appendChild(card);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => { ring.style.setProperty('--pct', pct); });
      });
    });
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  document.getElementById('btnAddMonth').addEventListener('click', addMonth);

  document.getElementById('btnExport').addEventListener('click', async () => {
    const data = JSON.stringify(state, null, 2);
    const filename = `gym-tracker-backup-${todayISO()}.json`;
    if(window.claude && window.claude.downloads){
      try { await window.claude.downloads.save({filename, data}); }
      catch(err){ showToast('اتلغت عملية الحفظ'); }
    } else {
      const blob = new Blob([data], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
  });

  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if(!Array.isArray(parsed.months) || !parsed.months.length) throw new Error('bad shape');
        state = {months: parsed.months.map(normalizeMonth)};
        persist();
        renderAll();
        showToast('تم استرجاع النسخة الاحتياطية');
      } catch(err){
        showToast('الملف مش صالح');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  renderAll();
})();
</script>
</body>
</html>
