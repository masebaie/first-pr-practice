<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>رحلتي مع الجيم</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="رحلتي مع الجيم" />
<meta name="theme-color" content="#12151A" />
<style>
  :root{
    color-scheme: light dark;
    --ink:#181B21;
    --paper:#F1F2F0;
    --steel:#6C7580;
    --accent:#2C6E49;
    --accent-ink:#FFFFFF;
    --accent-tint:rgba(44,110,73,0.09);
    --line:rgba(24,27,33,0.12);
    --surface:#FFFFFF;
    --surface-2:#E6E8E5;
    --shadow:0 1px 2px rgba(24,27,33,0.06);
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Tahoma, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECEDEE;
      --paper:#12151A;
      --steel:#8B939C;
      --accent:#57B784;
      --accent-ink:#0E1512;
      --accent-tint:rgba(87,183,132,0.14);
      --line:rgba(236,237,238,0.12);
      --surface:#1B1F25;
      --surface-2:#22262D;
      --shadow:0 1px 2px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECEDEE;
    --paper:#12151A;
    --steel:#8B939C;
    --accent:#57B784;
    --accent-ink:#0E1512;
    --accent-tint:rgba(87,183,132,0.14);
    --line:rgba(236,237,238,0.12);
    --surface:#1B1F25;
    --surface-2:#22262D;
    --shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-ui); }
  .hidden{ display:none !important; }
  .app{ max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;
        padding: max(20px, env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom)); }

  .eyebrow{ text-transform:uppercase; letter-spacing:0.08em; font-size:11px; color:var(--steel); margin:0 0 4px; font-weight:600; }
  h1{ font-size:clamp(21px,6vw,26px); margin:0 0 20px; font-weight:800; text-wrap:balance; letter-spacing:-0.01em; }

  .hero{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:center;
         box-shadow:var(--shadow); margin-bottom:24px; }
  .hero-label{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--steel); font-weight:700; margin:0 0 4px; }
  .hero-value{ font-weight:800; font-size:clamp(38px,12vw,48px); line-height:1.1; color:var(--accent);
               font-variant-numeric:tabular-nums; margin:0; }
  .progress{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:14px 0 10px; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:999px; width:0%; transition:width .25s ease; }
  .hero-sub{ font-size:12.5px; color:var(--steel); margin:0; }

  .section-head{ margin-bottom:10px; }
  .section-head h2{ font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); font-weight:700; margin:0; }

  .days{ margin-bottom:26px; }
  .day-hint{ font-size:12px; color:var(--steel); margin:0 0 14px; line-height:1.5; }
  .day-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .week-divider{ display:flex; align-items:baseline; justify-content:space-between; gap:8px;
                 padding:14px 2px 4px; }
  .week-divider:first-child{ padding-top:0; }
  .week-title{ font-size:12.5px; font-weight:700; color:var(--ink); }
  .week-range{ font-size:11px; color:var(--steel); }
  .day-row{ appearance:none; width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
            background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 14px;
            cursor:pointer; text-align:right; color:var(--ink);
            transition:background-color .15s ease, border-color .15s ease; }
  .day-row.is-attended{ background:var(--accent-tint); border-color:var(--accent); }
  .day-row.is-today{ box-shadow: inset 0 0 0 2px var(--accent); }
  .day-row:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .day-info{ display:flex; align-items:baseline; gap:8px; }
  .day-weekday{ font-size:13px; color:var(--steel); font-weight:600; min-width:52px; }
  .day-date{ font-size:14.5px; font-weight:600; }
  .day-today-tag{ font-size:10px; color:var(--accent); font-weight:700; }
  .day-check{ width:24px; height:24px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center;
              justify-content:center; color:var(--accent-ink); flex-shrink:0;
              transition:background-color .15s ease, border-color .15s ease; }
  .day-check.is-checked{ background:var(--accent); border-color:var(--accent); }

  .backup{ border-top:1px solid var(--line); padding-top:16px; margin-top:auto; }
  .backup-note{ font-size:12px; color:var(--steel); line-height:1.5; margin:0 0 12px; }
  .backup-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ appearance:none; border:none; border-radius:12px; padding:13px 16px; font-size:14.5px; font-weight:700;
        cursor:pointer; min-height:46px; width:100%; display:inline-flex; align-items:center; justify-content:center; }
  .btn-outline{ background:var(--surface); border:1px solid var(--line); color:var(--ink); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .backup-actions .btn{ flex:1; min-width:150px; }

  .toast{ position:fixed; bottom:20px; left:50%; z-index:10; background:var(--ink); color:var(--paper);
          padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
          opacity:0; transform:translate(-50%,8px); pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion:reduce){
    .day-row, .progress-fill, .toast{ transition:none; }
  }
</style>
</head>
<body>
<div class="app" dir="rtl" lang="ar">
  <header class="hd">
    <p class="eyebrow">تتبّع الحضور</p>
    <h1>رحلتي مع الجيم</h1>
  </header>

  <section class="hero" aria-label="عدد الحصص">
    <p class="hero-label">عدد الحصص</p>
    <p class="hero-value" id="statSessions">0</p>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <p class="hero-sub" id="heroSub"></p>
  </section>

  <section class="days">
    <div class="section-head"><h2>الأسابيع</h2></div>
    <p class="day-hint">دوس على أي يوم عشان تعلّم عليه إنك رحت الجيم، ودوس تاني عشان تشيل العلامة.</p>
    <ul class="day-list" id="dayList"></ul>
  </section>

  <section class="backup">
    <p class="backup-note">
      البيانات محفوظة على الموبايل ده بس. اعمل نسخة احتياطية بين كل فترة وارفعها على OneDrive عشان متضيعش لو غيّرت جهازك أو مسحت المتصفح.
    </p>
    <div class="backup-actions">
      <button id="btnExport" class="btn btn-outline" type="button">تنزيل نسخة احتياطية</button>
      <label class="btn btn-outline" for="importFile">استرجاع نسخة احتياطية</label>
      <input type="file" id="importFile" accept="application/json" class="hidden" />
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'gymTrackerData';
  const RANGE_START = '2026-08-09';
  const RANGE_END = '2026-09-08';
  const WEEK_LABELS = ['١','٢','٣','٤','٥'];
  const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  let state = load();
  const rowRefs = Object.create(null);

  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {sessions:[]};
      const parsed = JSON.parse(raw);
      return {sessions: Array.isArray(parsed.sessions) ? parsed.sessions : []};
    } catch(e){ return {sessions:[]}; }
  }
  function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function toISO(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayISO(){ return toISO(new Date()); }
  function formatDateShort(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('ar-EG', {day:'numeric', month:'short'});
  }
  function formatDateFull(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('ar-EG', {day:'numeric', month:'short', year:'numeric'});
  }

  function buildCalendarDates(){
    const dates = [];
    const cur = new Date(RANGE_START + 'T00:00:00');
    const end = new Date(RANGE_END + 'T00:00:00');
    while(cur <= end){
      dates.push(toISO(cur));
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  }
  const CAL_DATES = buildCalendarDates();

  function renderStats(){
    const count = state.sessions.length;
    document.getElementById('statSessions').textContent = count;
    document.getElementById('progressFill').style.width = `${Math.min(100, (count / CAL_DATES.length) * 100)}%`;
    document.getElementById('heroSub').textContent = `من ${CAL_DATES.length} يوم (${formatDateFull(RANGE_START)} – ${formatDateFull(RANGE_END)})`;
  }

  function toggleSession(dateStr){
    const idx = state.sessions.indexOf(dateStr);
    if(idx === -1){
      state.sessions.push(dateStr);
      showToast('اتسجّلت حصة يوم ' + formatDateFull(dateStr));
    } else {
      state.sessions.splice(idx, 1);
      showToast('اتشالت حصة يوم ' + formatDateFull(dateStr));
    }
    updateRow(dateStr);
    renderStats();
    persist();
  }

  function updateRow(dateStr){
    const ref = rowRefs[dateStr];
    if(!ref) return;
    const attended = state.sessions.includes(dateStr);
    ref.row.classList.toggle('is-attended', attended);
    ref.row.setAttribute('aria-pressed', attended ? 'true' : 'false');
    ref.check.classList.toggle('is-checked', attended);
    ref.check.innerHTML = attended ? CHECK_SVG : '';
  }

  function renderDays(){
    const list = document.getElementById('dayList');
    list.innerHTML = '';
    const today = todayISO();
    CAL_DATES.forEach((dateStr, i) => {
      if(i % 7 === 0){
        const weekIdx = i / 7;
        const rangeEndIdx = Math.min(i + 6, CAL_DATES.length - 1);
        const divider = document.createElement('li');
        divider.className = 'week-divider';
        divider.innerHTML = `
          <span class="week-title">الأسبوع ${WEEK_LABELS[weekIdx] || (weekIdx + 1)}</span>
          <span class="week-range">${formatDateShort(CAL_DATES[i])} – ${formatDateShort(CAL_DATES[rangeEndIdx])}</span>
        `;
        list.appendChild(divider);
      }
      const dObj = new Date(dateStr + 'T00:00:00');
      const attended = state.sessions.includes(dateStr);
      const isToday = dateStr === today;
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-row' + (attended ? ' is-attended' : '') + (isToday ? ' is-today' : '');
      btn.setAttribute('aria-pressed', attended ? 'true' : 'false');
      btn.innerHTML = `
        <span class="day-info">
          <span class="day-weekday">${dObj.toLocaleDateString('ar-EG', {weekday:'long'})}</span>
          <span class="day-date">${dObj.toLocaleDateString('ar-EG', {day:'numeric', month:'long'})}</span>
          ${isToday ? '<span class="day-today-tag">النهارده</span>' : ''}
        </span>
        <span class="day-check${attended ? ' is-checked' : ''}">${attended ? CHECK_SVG : ''}</span>
      `;
      btn.addEventListener('click', () => toggleSession(dateStr));
      li.appendChild(btn);
      list.appendChild(li);
      rowRefs[dateStr] = {row: btn, check: btn.querySelector('.day-check')};
    });
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  document.getElementById('btnExport').addEventListener('click', async () => {
    const data = JSON.stringify(state, null, 2);
    const filename = `gym-tracker-backup-${todayISO()}.json`;
    if(window.claude && window.claude.downloads){
      try { await window.claude.downloads.save({filename, data}); }
      catch(err){ showToast('اتلغت عملية الحفظ'); }
    } else {
      const blob = new Blob([data], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
  });

  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if(!Array.isArray(parsed.sessions)) throw new Error('bad shape');
        state = {sessions: parsed.sessions};
        renderStats();
        renderDays();
        persist();
        showToast('تم استرجاع النسخة الاحتياطية');
      } catch(err){
        showToast('الملف مش صالح');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  renderStats();
  renderDays();
})();
</script>
</body>
</html>
